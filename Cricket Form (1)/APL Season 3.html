<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>APL Season 3 — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0e0d0c; min-height: 100vh; overflow-x: hidden; font-family: 'Inter', sans-serif; }
  .stage {
    min-height: 100vh; padding: 40px 16px;
    display: flex; gap: 32px; justify-content: center; align-items: flex-start;
    background:
      radial-gradient(ellipse at top, rgba(255,195,31,0.08), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(225,29,42,0.06), transparent 50%),
      #0e0d0c;
  }
  .frame-col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .frame-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px;
    color: rgba(255,255,255,0.55); text-transform: uppercase;
  }
  .frame-label .y { color: #FFC31F; }
  @media (max-width: 900px) { .stage { flex-direction: column; align-items: center; padding: 24px 12px; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="screens/landing.jsx"></script>
<script type="text/babel" src="screens/register.jsx"></script>

<script type="text/babel">
  const { IOSDevice, Landing, Register } = window;

  function App() {
    const [page, setPage] = React.useState('landing');
    React.useEffect(() => {
      window.goRegister = () => setPage('register');
      window.goLanding = () => setPage('landing');
    }, []);

    return (
      <div className="stage" data-screen-label="01 APL Mobile">
        <div className="frame-col" data-screen-label="01 Landing">
          <div className="frame-label"><span className="y">01</span> · LANDING PAGE</div>
          <IOSDevice width={390} height={780} dark>
            <Landing />
          </IOSDevice>
        </div>
        <div className="frame-col" data-screen-label="02 Registration">
          <div className="frame-label"><span className="y">02</span> · REGISTRATION</div>
          <IOSDevice width={390} height={780} dark>
            <Register />
          </IOSDevice>
        </div>
        <div className="frame-col" data-screen-label="03 Live">
          <div className="frame-label"><span className="y">03</span> · LIVE PREVIEW · {page.toUpperCase()}</div>
          <IOSDevice width={390} height={780} dark>
            {page === 'landing' ? <Landing /> : <Register />}
          </IOSDevice>
          <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
            <button onClick={() => setPage('landing')} style={{
              background: page === 'landing' ? '#FFC31F' : 'transparent',
              color: page === 'landing' ? '#0a0a0a' : '#fff',
              border: '1px solid ' + (page === 'landing' ? '#FFC31F' : 'rgba(255,255,255,0.2)'),
              padding: '8px 14px', fontFamily: 'Anton, sans-serif',
              fontSize: 12, letterSpacing: 1.5, cursor: 'pointer',
            }}>LANDING</button>
            <button onClick={() => setPage('register')} style={{
              background: page === 'register' ? '#FFC31F' : 'transparent',
              color: page === 'register' ? '#0a0a0a' : '#fff',
              border: '1px solid ' + (page === 'register' ? '#FFC31F' : 'rgba(255,255,255,0.2)'),
              padding: '8px 14px', fontFamily: 'Anton, sans-serif',
              fontSize: 12, letterSpacing: 1.5, cursor: 'pointer',
            }}>REGISTER</button>
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
